<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Pet - Dialog Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            color: white;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }

        .test-section {
            margin-bottom: 30px;
        }

        .test-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-claude {
            background: linear-gradient(135deg, #FF8C00, #FF6347);
            color: white;
        }

        .btn-claude:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 140, 0, 0.3);
        }

        .btn-codex {
            background: linear-gradient(135deg, #0096FF, #0077BE);
            color: white;
        }

        .btn-codex:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 150, 255, 0.3);
        }

        .btn-neutral {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-neutral:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
            margin-bottom: 10px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .status-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.6;
        }

        .status-label {
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .status-value {
            color: #4ECCA3;
            font-weight: 600;
            word-break: break-all;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 30px 0;
        }

        code {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }

        .info {
            background: rgba(100, 200, 255, 0.1);
            border-left: 3px solid #0096FF;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Claude Pet - Dialog Test</h1>

        <!-- Claude对话框测试 -->
        <div class="test-section">
            <h2>Claude对话框（橙色）</h2>
            <div class="button-group">
                <button class="btn-claude" onclick="showClaudeDialog('Claude思考中...')">显示思考</button>
                <button class="btn-claude" onclick="showClaudeDialog('Claude生成回复中...')">显示生成</button>
                <button class="btn-claude" onclick="showClaudeDialog('这是一个来自Claude的完整回复示例，包含多行内容。\\n\\nClaude可以提供帮助和建议。')">显示长文本</button>
                <button class="btn-neutral" onclick="hideDialog()">隐藏对话框</button>
            </div>
        </div>

        <!-- Codex对话框测试 -->
        <div class="test-section">
            <h2>Codex对话框（蓝色）</h2>
            <div class="button-group">
                <button class="btn-codex" onclick="showCodexDialog('Codex思考中...')">显示思考</button>
                <button class="btn-codex" onclick="showCodexDialog('Codex生成代码中...')">显示生成</button>
                <button class="btn-codex" onclick="showCodexDialog('function hello() {\\n  console.log(\"Hello from Codex\");\\n}')">显示代码</button>
                <button class="btn-neutral" onclick="hideDialog()">隐藏对话框</button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- 自定义内容 -->
        <div class="test-section">
            <h2>自定义对话框</h2>
            <textarea id="custom-text" placeholder="输入自定义对话框内容...">自定义对话框内容</textarea>
            <div class="button-group">
                <button class="btn-claude" onclick="showCustomDialog('claude')">显示为Claude</button>
                <button class="btn-codex" onclick="showCustomDialog('codex')">显示为Codex</button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- 自动测试序列 -->
        <div class="test-section">
            <h2>自动测试序列</h2>
            <button class="btn-neutral" onclick="runTestSequence()" style="width: 100%;">运行完整测试序列</button>
            <div class="info">
                ℹ️ 将依次显示Claude对话、Codex对话和隐藏，总耗时10秒。
            </div>
        </div>

        <div class="status-box">
            <div class="status-label">最后操作:</div>
            <div class="status-value" id="status">等待操作...</div>
        </div>
    </div>

    <script>
        let currentSource = 'claude';

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log('[DialogTest]', message);
        }

        function showDialog(content, source) {
            currentSource = source;

            // 调用全局API
            if (window.claudePetUI && window.claudePetUI.showDialog) {
                window.claudePetUI.showDialog(content, source);
            } else {
                console.warn('[DialogTest] claudePetUI not available');
            }

            updateStatus(`显示${source === 'claude' ? 'Claude' : 'Codex'}对话框: ${content.substring(0, 30)}...`);
        }

        function hideDialog() {
            if (window.claudePetUI && window.claudePetUI.hideDialog) {
                window.claudePetUI.hideDialog();
            }
            updateStatus('隐藏对话框');
        }

        function showClaudeDialog(content) {
            showDialog(content, 'claude');
        }

        function showCodexDialog(content) {
            showDialog(content, 'codex');
        }

        function showCustomDialog(source) {
            const content = document.getElementById('custom-text').value || '自定义内容';
            showDialog(content, source);
        }

        function runTestSequence() {
            updateStatus('开始自动测试序列...');

            setTimeout(() => {
                showClaudeDialog('Claude在思考您的问题...');
            }, 500);

            setTimeout(() => {
                showClaudeDialog('Claude正在生成回复...');
            }, 3000);

            setTimeout(() => {
                showCodexDialog('Codex准备生成代码...');
            }, 5000);

            setTimeout(() => {
                showCodexDialog('Codex正在编写代码...');
            }, 7000);

            setTimeout(() => {
                hideDialog();
                updateStatus('测试序列完成');
            }, 10000);
        }

        // 页面加载时
        window.addEventListener('load', () => {
            updateStatus('测试页面已加载，claudePetUI可用');

            // 检查claudePetUI
            if (window.claudePetUI) {
                console.log('[DialogTest] claudePetUI available:', window.claudePetUI);
            } else {
                console.log('[DialogTest] claudePetUI not available - may be running standalone');
            }
        });
    </script>
</body>
</html>
